# What this is: the same secret guard that runs on your computer at commit
# time, run again on GitHub for every push and pull request. This covers
# changes that never went through a local commit hook — including changes
# written by cloud AI agents.
# Safe to edit: yes — shipshape will ask before overwriting your edits.
# managed-by: shipshape v0.2.1
name: Secret scan

on:
  push:
    branches: ["main"]
  pull_request:

# Least privilege: this workflow only needs to read the code.
permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan changed lines for secrets
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || ! git cat-file -e "$base" 2>/dev/null; then
            base="$(git rev-parse HEAD~1 2>/dev/null || git hash-object -t tree /dev/null)"
          fi
          bash .sdlc/hooks/secret-guard.sh --range "$base"..HEAD
