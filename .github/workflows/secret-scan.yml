# What this is: the secret guard run from the trusted base commit against
# every proposed commit. Pull requests use the default branch's workflow and
# scanner, so proposed code cannot replace the scanner that inspects it.
# Initial pushes and bases without a trusted scanner fail closed and explain
# that shipshape must first be bootstrapped on the default branch.
# Safe to edit: yes — shipshape will ask before overwriting your edits.
# managed-by: shipshape v0.2.1
name: Secret scan

on:
  push:
    branches: ["main"]
  pull_request_target:

# Least privilege: this workflow only needs to read the code.
permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Scan every proposed commit with the trusted guard
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -eu
          zero_sha="0000000000000000000000000000000000000000"
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "$zero_sha" ]; then
            echo "ERROR: no trusted base commit exists for this initial push." >&2
            echo "Bootstrap shipshape on the default branch before relying on this scan." >&2
            exit 2
          fi
          if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null || \
             ! git cat-file -e "$HEAD_SHA^{commit}" 2>/dev/null; then
            echo "ERROR: the trusted base or proposed head commit is unavailable." >&2
            exit 2
          fi
          trusted_guard="$RUNNER_TEMP/shipshape-secret-guard.sh"
          if ! git show "$BASE_SHA:.sdlc/hooks/secret-guard.sh" >"$trusted_guard"; then
            echo "ERROR: the trusted base does not contain the shipshape secret guard." >&2
            echo "Bootstrap shipshape on the default branch before relying on this scan." >&2
            exit 2
          fi
          chmod 700 "$trusted_guard"
          bash "$trusted_guard" --range "$BASE_SHA..$HEAD_SHA"
